apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      # Conservative pod-level hardening. We deliberately do NOT set
      # runAsNonRoot or readOnlyRootFilesystem here: the agent shells out to
      # kubectl/helm/buildctl, so changing the user or making the root FS
      # read-only can break it. seccomp is safe. The agent is stateless (its
      # state lives in the system PostgreSQL), so there is no PVC.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Container-level hardening kept conservative for the same reason:
          # drop all capabilities and forbid privilege escalation, but leave
          # the user / root FS alone (the agent runs kubectl/helm/buildctl).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
          env:
            - name: GROUP_NAME
              value: {{ .Values.groupName | quote }}
            # The agent discovers the cluster's system PostgreSQL via this
            # ConfigMap (maintained by the control plane) and self-provisions
            # its own database there; no DB credentials live in this manifest.
            - name: RUNOS_SYSTEM_DB_REF
              value: {{ .Values.systemDb.configMapName | quote }}
            - name: RUNOS_SYSTEM_DB_NAMESPACE
              value: {{ .Release.Namespace | quote }}
          envFrom:
            - configMapRef:
                name: runos-config
          ports:
            - name: https
              containerPort: 443
              protocol: TCP
            - name: webhook
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          volumeMounts:
            - name: certs
              mountPath: /tls
              readOnly: true
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: certs
          secret:
            secretName: {{ include "example-webhook.servingCertificate" . }}
    {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{- end }}
