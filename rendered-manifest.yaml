---
# Source: runos-cluster-agent/templates/rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runos-cluster-agent
  namespace: "runos"
  labels:
    app: runos-cluster-agent
---
# Source: runos-cluster-agent/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: runos-config
  namespace: runos
data:
  aid: ""  # Replace with your actual AID value
  server: ""  # Replace with your actual server URL
  installer_url: ""  # URL for the installer
  cd: ""  # cluster domain like cid.aid.runos.xyz
---
# Source: runos-cluster-agent/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runos-cluster-agent-data
  namespace: "runos"
  labels:
    app: runos-cluster-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Source: runos-cluster-agent/templates/rbac.yaml
# For the webhook functionality - permissions needed by cert-manager
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runos-cluster-agent:domain-solver
  labels:
    app: runos-cluster-agent
rules:
  - apiGroups:
      - acme.runos.com
    resources:
      - '*'
    verbs:
      - 'create'
---
# Source: runos-cluster-agent/templates/rbac.yaml
# For your main app - full admin access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runos-cluster-agent:admin
  labels:
    app: runos-cluster-agent
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "*"
---
# Source: runos-cluster-agent/templates/rbac.yaml
# Bind the domain-solver role to cert-manager
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runos-cluster-agent:domain-solver
  labels:
    app: runos-cluster-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runos-cluster-agent:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
# Source: runos-cluster-agent/templates/rbac.yaml
# Bind the admin role to your app
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runos-cluster-agent:admin
  labels:
    app: runos-cluster-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runos-cluster-agent:admin
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: runos-cluster-agent
    namespace: runos
---
# Source: runos-cluster-agent/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runos-cluster-agent:auth-delegator
  labels:
